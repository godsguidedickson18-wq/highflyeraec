# ─────────────────────────────────────────────────────────────────────────────
# Highflyer Adult Education Centre — GitHub Pages Configuration
# ─────────────────────────────────────────────────────────────────────────────

title: "Highflyer Adult Education Centre"
tagline: "Rise Above Limits."
description: >
  Affordable adult literacy classes in Port Harcourt, Rivers State, Nigeria.
  Teaching adults to read, write, and communicate with confidence since 2022.

url: "https://godsguidedickson18-wq.github.io"
baseurl: "/highflyeraec"

# ── Site identity ──────────────────────────────────────────────────────────────
author:
  name: "Highflyer Adult Education Centre"
  email: "hello@highflyeraec.org"

lang: "en-NG"
timezone: "Africa/Lagos"
encoding: "utf-8"

# ── Social ─────────────────────────────────────────────────────────────────────
social:
  facebook: "highflyeraec"
  youtube:  "highflyeraec"
  whatsapp: "2349068427526"

# ── SEO & Open Graph defaults ──────────────────────────────────────────────────
logo: "/highflyeraec/images/founder.jpeg"
og_image: "https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=1200&auto=format&fit=crop&q=80"

# ── Build settings ─────────────────────────────────────────────────────────────
# We use plain HTML — tell Jekyll not to process our files with Liquid
plugins:
  - jekyll-sitemap   # generates /sitemap.xml automatically (optional — we have our own)

# Exclude files that should not be served publicly
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.sh"
  - ".github"
  - "node_modules"

# Keep our handcrafted sitemap.xml and robots.txt as-is
keep_files:
  - sitemap.xml
  - robots.txt

# ── Collections (none — plain HTML site) ──────────────────────────────────────
# No Jekyll collections needed. All pages are plain .html files.

# ── Markdown (not used, but set for safety) ───────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM

# ── Sass (not used — we use plain CSS) ───────────────────────────────────────
# sass:
#   style: compressed

# ── Google Analytics ──────────────────────────────────────────────────────────
# Uncomment and add your GA4 Measurement ID when ready:
# google_analytics: "G-XXXXXXXXXX"

